# Token Guardian - Model Configuration
# System config at /etc/tokenguardian/models.yaml
# User override at ~/.tokenguardian/models.yaml

# Model Definitions (cost: $ per 1M tokens input/output)
models:
  minimax/MiniMax-M2.1:
    cost:
      input: 0.50
      output: 0.50
    capabilities:
      - simple_qa
      - general
      - creative
    tier: 1
    latency: fast
  
  openai/gpt-5-mini:
    cost:
      input: 1.50
      output: 6.00
    capabilities:
      - simple_qa
      - general
      - creative
      - reasoning
      - coding
      - data_analysis
    tier: 2
    latency: medium
  
  xai/grok-4:
    cost:
      input: 3.00
      output: 15.00
    capabilities:
      - coding
      - data_analysis
      - reasoning
      - creative
    tier: 3
    latency: medium
  
  openai/gpt-5.2:
    cost:
      input: 10.00
      output: 30.00
    capabilities:
      - coding
      - data_analysis
      - reasoning
      - creative
      - complex_analysis
    tier: 4
    latency: slow
  
  anthropic/claude-opus-4-5:
    cost:
      input: 15.00
      output: 75.00
    capabilities:
      - coding
      - data_analysis
      - reasoning
      - creative
      - complex_analysis
      - long_context
    tier: 5
    latency: slow

# Fallback Chain (used when model unavailable)
fallback_chain:
  - minimax/MiniMax-M2.1
  - openai/gpt-5-mini
  - xai/grok-4
  - openai/gpt-5.2
  - anthropic/claude-opus-4-5

# Safe Mid-Tier Fallback (for low-confidence routing)
safe_fallback:
  model: openai/gpt-5-mini
  description: "Mid-tier model used when confidence is below threshold"
